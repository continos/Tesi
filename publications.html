<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title data-simply-field="pageTitle">Nuova Pagina</title>

  <!-- Favicons -->
  <link href="assets/img/favicon.png" rel="icon">
  <link href="assets/img/apple-touch-icon.png" rel="apple-touch-icon">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Montserrat:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Raleway:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

  <!-- Vendor CSS Files -->
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/vendor/aos/aos.css" rel="stylesheet">
  <link href="assets/vendor/glightbox/css/glightbox.min.css" rel="stylesheet">
  <link href="assets/vendor/swiper/swiper-bundle.min.css" rel="stylesheet">

  <!-- Main CSS File -->
  <link href="assets/css/mainInformatica.css" rel="stylesheet">

</head>

<body class="details-page">

  <header id="header" class="header d-flex align-items-center fixed-top">
    <div class="container-fluid container-xl position-relative d-flex align-items-center justify-content-between">
        <a href="index.html" class="logo d-flex align-items-center">
          <!-- Uncomment the line below if you also wish to use an image logo -->
          <img src="assets/img/logoTv.png" alt="Informatica - Università di Roma Tor Vergata"  data-simply-field="logo" data-simply-path="/"> 
          <!-- <h1 class="sitename"></h1> -->
        </a>
        <nav id="navmenu" class="navmenu">
          <ul data-simply-list="header" data-simply-path="/" data-simply-sortable>
            <template data-simply-template="item">
              <li><a data-simply-field="item">Item</a></li>
            </template>
            <template data-simply-template="submenu">
              <li class="dropdown">
                <a href="#">
                  <span data-simply-field="item">Submenu</span> 
                  <i class="bi bi-chevron-down toggle-dropdown"></i>
                </a>
                <ul data-simply-list="submenu" data-simply-sortable>
                  <template data-simply-template="item">
                    <li><a data-simply-field="item">Item</a></li>
                  </template>
                </ul>
              </li>
            </template>
            <template data-simply-template="search-icon">
              <li class="search-icon"><a href="#"><i class="bi bi-search"></i></a></li>
            </template>
          </ul>
          <i class="mobile-nav-toggle d-xl-none bi bi-list"></i>
        </nav>
    </div>
  </header>

  <main id="main" class="main">
    <div class="sections" data-simply-list="sections" data-simply-sortable="true">
      <!-- Page Title -->
      <template data-simply-template="pageTitle" data-simply-template-icon="fa-header">
        <div class="page-title dark-background" >
          <img class="page-title-bg" data-simply-field="backgroundImage" src="https://www-2020.cs.uniroma2.it/wp-content/uploads/2020/11/ai-2-scaled.jpeg" alt="">
          <div class="container page-title-content">
            <h1 data-simply-field="mainHeading">Titolo Principale</h1>
            <nav class="breadcrumbs">
              <ol>
                <li><a href="index.html">Home</a></li>
                <li class="current" data-simply-field="breadcrumb">Sottotitolo</li>
              </ol>
            </nav>
          </div>
        </div>
      </template>
      <template data-simply-template="publicationSearch" data-simply-template-icon="fa-search">
        <section id="publications-search" class="publications-search section">
          <div class="container">
            <!-- Titolo della Sezione -->
            <div class="section-title" data-aos="fade-up">
              <h2>Cerca Pubblicazioni</h2>
              <p>Cerca nell'archivio di art.torvergata.it</p>
            </div>
            <!-- Barra di Ricerca -->
            <div class="row justify-content-center" data-aos="fade-up" data-aos-delay="100">
              <div class="col-lg-8">
                <form id="search-form" class="d-flex">
                  <input type="text" id="search-query" class="form-control me-2" placeholder="Inserisci titolo, autore, anno...">
                  <button type="submit" class="btn btn-primary">Cerca</button>
                </form>
              </div>
            </div>
            <!-- Area Risultati -->
            <div id="results-container" class="row gy-4 mt-4">
              <!-- I risultati della ricerca verranno inseriti qui dinamicamente -->
            </div>
            <!-- Indicatore di Caricamento -->
            <div id="loading-indicator" class="text-center mt-4" style="display: none;">
              <div class="spinner-border" role="status">
                <span class="visually-hidden">Caricamento...</span>
              </div>
            </div>
          </div>
        </section>
      </template>
      <template data-simply-template="content" data-simply-template-icon="fa-align-left">
        <section class="content">
          <h2 class="title" data-simply-field="title">Title</h2>
          <div class="text" data-simply-field="text">Text</div>
        </section>
      </template>
      <template data-simply-template="pullquote" data-simply-template-icon="fa-quote-right">
        <section class="pullquote">
          <div class="text" data-simply-field="text">Text</div>
          <blockquote class="quote" data-simply-field="quote">Quote</blockquote>
        </section>
      </template>
      <template data-simply-template="image left" data-simply-template-icon="fa-picture-o">
        <section class="image-left">
          <img class="image" data-simply-field="image">
          <div class="text" data-simply-field="text">Text</div>
        </section>
      </template>
    </div>
  </main>


  <footer id="footer" class="footer light-background">
    <div class="footer-top">
      <div class="container">
        <div class="row gy-4 justify-content-center">

          <!-- Colonna 1: Logo Università -->
          <div class="col-lg-4 col-md-6 footer-about text-center">
            <a href="https://web.uniroma2.it/" class="logo d-block mb-4" target="_blank" rel="noopener noreferrer">
              <img data-simply-field="footerLogo" data-simply-path="/" src="https://www-2020.cs.uniroma2.it/wp-content/uploads/2020/09/logo-small-png.png" alt="Università di Roma Tor Vergata">
            </a>
          </div>

          <!-- Colonna 2: Link Utili/Admin -->
          <div class="col-lg-2 col-6 footer-links">
            <h4>Area Riservata</h4>
            <ul>
              <li><a data-simply-field="footerLoginLink" data-simply-path="/" href="#">Accedi</a></li>
            </ul>
          </div>

        </div>
      </div>
    </div>

    <div class="container copyright text-center">
      <p>
        © <span>Copyright</span> <strong class="px-1 sitename">Nova</strong> <span>All Rights Reserved</span>
      </p>
      <div class="credits">
        Designed by <a href="https://bootstrapmade.com/">BootstrapMade</a>
      </div>
    </div>
  </footer>

  <!-- Scroll Top -->
  <a href="#" id="scroll-top" class="scroll-top d-flex align-items-center justify-content-center"><i class="bi bi-arrow-up-short"></i></a>

  <!-- Preloader -->
  <div id="preloader"></div>

  <!-- Vendor JS Files -->
  <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="assets/vendor/php-email-form/validate.js"></script>
  <script src="assets/vendor/aos/aos.js"></script>
  <script src="assets/vendor/glightbox/js/glightbox.min.js"></script>
  <script src="assets/vendor/swiper/swiper-bundle.min.js"></script>
  <script src="assets/vendor/imagesloaded/imagesloaded.pkgd.min.js"></script>
  <script src="assets/vendor/isotope-layout/isotope.pkgd.min.js"></script>

  <!-- Main JS File -->
  <script src="assets/js/main.js"></script>
  <script src="assets/js/publication-search.js" defer></script> 

  <!-- SimplyEdit -->
  <script src="assets/js/simply-edit-config.js"></script>
  <!-- Configurazione SimplyEdit per GitHub -->
  <script
    src="simplyedit/js/simply-edit.js"
    data-simply-storage="customGithub"
    data-simply-repo-user="continos"
    data-simply-repo-name="Tesi"
    data-simply-repo-branch="render-deploy"
    data-simply-settings="customSettings"
  ></script>
  <!-- Pulsante per attivare Edit Mode -->
  <a href="publications.html#simply-edit" id="edit-mode-button" title="Attiva Edit Mode">
    <i class="bi bi-pencil-square"></i>
  </a>
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Login - Amministrazione Sito</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Montserrat:wght@400;700&family=Raleway:wght@400;700&display=swap" rel="stylesheet">
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/css/mainInformatica.css" rel="stylesheet">
  <style>
    /* Stile per centrare verticalmente il contenuto */
    html, body {
      height: 100%;
    }
    body {
      display: flex;
      align-items: center;
      background-color: #f8f9fa;
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      margin: auto; /* Centra la card orizzontalmente */
      padding: 2rem;
    }
  </style>
</head>
<body>

<div class="container-fluid">
  <main>
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="card login-card shadow-lg">
            <div class="card-body">
              <div class="text-center mb-4">
                <img src="assets/img/logoTv.png" alt="Logo" style="max-height: 50px;">
                <h3 class="mt-3">Area Riservata</h3>
              </div>
              <form id="login-form">
                <div class="mb-3">
                  <label for="username" class="form-label">Username</label>
                  <input type="text" class="form-control" id="username" required>
                </div>
                <div class="mb-3">
                  <label for="password" class="form-label">Password</label>
                  <input type="password" class="form-control" id="password" required>
                </div>
                <div class="d-grid">
                  <button type="submit" class="btn btn-primary">Accedi</button>
                </div>
                <div id="error-message" class="text-danger mt-3 text-center" style="display: none;"></div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
  document.getElementById('login-form').addEventListener('submit', function(event) {
    event.preventDefault();
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const errorMessage = document.getElementById('error-message');

    fetch('/login', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ username, password }),
    })
    .then(response => {
      if (response.ok) {
        window.location.href = '/index.html';
      } else {
        errorMessage.textContent = 'Credenziali non valide. Riprova.';
        errorMessage.style.display = 'block';
      }
    })
    .catch(error => {
      console.error('Errore di rete:', error);
      errorMessage.textContent = 'Errore di connessione con il server.';
      errorMessage.style.display = 'block';
    });
  });
</script>

</body>
</html>
